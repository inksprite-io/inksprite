[package]
name = "inksprite"
version = "0.1.0"
description = "A writing app with AI built in"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# `tauri::generate_context!` writes the plugins' configuration out as its values.
serde_json = "1"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
