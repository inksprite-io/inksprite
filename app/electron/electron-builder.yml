# How the app is packaged for each system: `npm run dist` builds for the one
# it runs on, from the page in app/dist. The release workflow builds them
# all (.github/workflows/release.yml).

appId: io.inksprite.inksprite
productName: inksprite
directories:
  buildResources: build
  output: dist

# The main process, and the page beside it. The Python sandbox's page, and
# the packages it offers, fetched by scripts/fetch-python.mjs before a build
# (src/sandbox.js). Pyodide comes with the dependencies. The terminal's
# frame's page (src/terminals.js), whose emulator comes with them too.
files:
  - package.json
  - src/**
  - sandbox/**
  - terminal/**
  - python/**
  - from: ../dist
    to: page
  # Of node-pty, what runs: not what it is built from.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings,binding.gyp}'
  - '!node_modules/node-pty/prebuilds/**/*.pdb'

# node-pty comes with its binaries built for every system, so nothing is
# compiled here, and a Mac's app can be built on Linux (build-for-mac.sh).
# Each system's build carries its own (below). They are files beside the
# archive, since a Mac starts a shell through a program of node-pty's. Only
# they are: node-pty's JavaScript runs in the main process, and stays in the
# archive, which is checked as the app starts (the fuses below). So nothing
# is unpacked for having a binary in it, which would be all of node-pty, the
# one package here that has any.
npmRebuild: false
asar:
  smartUnpack: false
asarUnpack:
  - node_modules/node-pty/prebuilds/**

# No spaces: GitHub renames a release's files with spaces in, and the
# updater would then look for names that aren't there.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# What the app's binary can be made to do other than run the app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  grantFileProtocolExtraPrivileges: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true

# Where the updater looks: the latest release's latest*.yml (src/updates.js).
publish:
  provider: generic
  url: https://github.com/inksprite-io/inksprite/releases/latest/download
  channel: latest

# A disk image to install from, and a zip for the updater, for Apple silicon
# and Intel Macs each. Signed and notarized when the release workflow's
# Apple secrets are set.
mac:
  category: public.app-category.productivity
  files:
    - '!node_modules/node-pty/prebuilds/{linux,win32}-*'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

# Installs for the user, with no admin prompt, where an unsigned installer
# for the machine would ask as an unknown publisher. An installer for Intel
# and AMD and one for ARM, rather than one holding both at twice the size:
# both are in latest.yml, and the updater takes the one whose name has its
# own processor in it (findFile in electron-updater's Provider.js).
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  files:
    - '!node_modules/node-pty/prebuilds/{darwin,linux}-*'
  # All of node-pty beside the archive here, as it was before the others were
  # narrowed: on Windows it starts a worker from a script of its own, which
  # is untried inside the archive, and Windows can't be tried where this is
  # built. Its console host (prebuilds/win32-*/conpty) is what a terminal runs
  # on there (ptyOptions in src/terminals.js).
  asarUnpack:
    - node_modules/node-pty/**
nsis:
  oneClick: true
  perMachine: false
  buildUniversalInstaller: false

# The AppImage's newer runtime, which needs no FUSE 2 (libfuse2): Ubuntu has
# installed only FUSE 3 since 22.04, so the old one wouldn't start there
# without it. electron-builder still calls this toolset a beta.
toolsets:
  appimage: '1.0.3'

# The window goes with the app's .desktop entry by its desktopName
# (package.json). For Intel and AMD, and for ARM, each with an update file of
# its own (latest-linux.yml, latest-linux-arm64.yml): node-pty brings its
# binary for both, and nothing else the app runs depends on the processor.
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  files:
    - '!node_modules/node-pty/prebuilds/{darwin,win32}-*'
  category: Office
  maintainer: inksprite
  syncDesktopName: true
