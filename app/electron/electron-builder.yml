# How the app is packaged for each system: `npm run dist` builds for the one
# it runs on, from the page in app/dist. The release workflow builds them
# all (.github/workflows/release.yml).

appId: io.inksprite.inksprite
productName: inksprite
directories:
  buildResources: build
  output: dist

# The main process, and the page beside it. The Python sandbox's page, and
# the packages it offers, fetched by scripts/fetch-python.mjs before a build
# (src/sandbox.js). Pyodide comes with the dependencies. The terminal's
# frame's page (src/terminals.js), whose emulator comes with them too.
files:
  - package.json
  - src/**
  - sandbox/**
  - terminal/**
  - python/**
  - from: ../dist
    to: page
  # Of node-pty, what runs: not what it is built from.
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings,binding.gyp}'
  - '!node_modules/node-pty/prebuilds/**/*.pdb'

# node-pty comes with its binaries built for every system, so nothing is
# compiled here, and a Mac's app can be built on Linux (build-for-mac.sh).
# Each system's build carries its own (below). They are files beside the
# archive, since a Mac starts a shell through a program of node-pty's.
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**

# No spaces: GitHub renames a release's files with spaces in, and the
# updater would then look for names that aren't there.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# What the app's binary can be made to do other than run the app.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  grantFileProtocolExtraPrivileges: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true

# Where the updater looks: the latest release's latest*.yml (src/updates.js).
publish:
  provider: generic
  url: https://github.com/inksprite-io/inksprite/releases/latest/download
  channel: latest

# A disk image to install from, and a zip for the updater, for Apple silicon
# and Intel Macs each. Signed and notarized when the release workflow's
# Apple secrets are set.
mac:
  category: public.app-category.productivity
  files:
    - '!node_modules/node-pty/prebuilds/{linux,win32}-*'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

# Installs for the user, with no admin prompt, where an unsigned installer
# for the machine would ask as an unknown publisher.
win:
  target:
    - target: nsis
      arch: [x64]
  files:
    - '!node_modules/node-pty/prebuilds/{darwin,linux}-*'
nsis:
  oneClick: true
  perMachine: false

# The window goes with the app's .desktop entry by its desktopName
# (package.json).
linux:
  target: [AppImage, deb]
  files:
    - '!node_modules/node-pty/prebuilds/{darwin,win32}-*'
  category: Office
  maintainer: inksprite
  syncDesktopName: true
