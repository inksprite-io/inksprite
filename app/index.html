<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The keys are in this page's database, so script that gets in runs with
      them: only the app's own scripts run. Images only from here, since one
      from elsewhere is a request that carries whatever its address says.
      Requests aren't limited, because the writer's servers can be anywhere.
      Here rather than in a header so that the desktop app has it too;
      vercel.json adds what only a header can say.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; object-src 'none'; base-uri 'none'; img-src 'self' data: blob:"
    />
    <link rel="icon" type="image/svg+xml" href="/static/icons/inksprite_i.svg" />
    <link rel="shortcut icon" href="/static/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="inksprite" />
    <link rel="manifest" href="/static/icons/site.webmanifest" />
    <!--
      The title bar of the installed app's window, in the page's background.
      The system's theme until the app knows the writer's, when applyTheme
      (composables/useSystemSettings.js) gives both the theme's colour.
    -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=contain, interactive-widget=resizes-content"
    />
    <link href="/src/style.css" rel="stylesheet" />
    <title>inksprite</title>
  </head>

  <body>
    <div id="app" class="h-dvh"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
