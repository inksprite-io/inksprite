name: Desktop Release

# The desktop app for macOS, Windows and Linux, published as a pre-release.
# The Mac build is for Apple silicon and Intel Macs at once, signed and
# notarized; the Windows and Linux builds are not signed. Run by pushing a tag
# (v0.1.0-dev.1), or by hand with one, which is then made at the commit being
# built.
#
# The page is built once, and each platform wraps that same build. The release
# is made only when every platform has built, so it never goes out with one
# missing.
#
# Never on a pull request: this workflow holds the signing secrets. They live
# in the `release` environment, which only the page and macOS jobs ask for. It
# runs only on a public repository, because a release there is the only kind
# that can be downloaded without signing in to GitHub.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, such as v0.1.0-dev.1'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  TAURI_CLI_VERSION: 2.12.1

jobs:
  page:
    name: Page
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    environment: release

    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "A release tag starts with v and a number: $TAG"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # engines.node: pdfjs-dist 6 needs Node 22.13 or later.
          node-version-file: app/package.json
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # VITE_VERCEL_ANALYTICS is left unset, so the desktop build has none.
      # The desktop Google client is the release environment's; unset, the
      # build has no import from Google Drive.
      - name: Build the page
        working-directory: app
        env:
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: app/dist
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS
    needs: page
    runs-on: macos-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: page
          path: app/dist

      - name: Add both Mac architectures to Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      # Tauri imports the certificate into a keychain of its own, signs the
      # app, sends it to Apple to be notarized, and staples the ticket to it.
      # The key file is written where the runner throws its files away.
      - name: Build, sign and notarize
        working-directory: app/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          cargo tauri build --target universal-apple-darwin

      # The check a Mac makes on an app downloaded from the internet: signed
      # with a Developer ID, and notarized, with the ticket stapled on.
      - name: Check Gatekeeper accepts the app
        working-directory: app/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          spctl --assess --type execute --verbose=2 macos/inksprite.app
          xcrun stapler validate macos/inksprite.app

      - uses: actions/upload-artifact@v4
        with:
          name: app-macOS
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux-windows:
    name: ${{ matrix.name }}
    needs: page
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # The oldest Ubuntu GitHub still runs. The app links against the
          # glibc of the system that builds it, and won't start on one older.
          - name: Linux
            runner: ubuntu-22.04
            bundles: appimage,deb
            cli: cargo-tauri
            files: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/deb/*.deb
          # The NSIS installer only: it installs for the user, with no admin
          # prompt, where an unsigned MSI would ask as an unknown publisher.
          - name: Windows
            runner: windows-latest
            bundles: nsis
            cli: cargo-tauri.exe
            files: app/src-tauri/target/release/bundle/nsis/*-setup.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: page
          path: app/dist

      # What Tauri builds against, and the GStreamer plugins the AppImage
      # takes along so narration can play: it carries every plugin installed
      # here, so recommended packages (ffmpeg's among them) are left out.
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio

      - name: Cache the Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/${{ matrix.cli }}
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Build
        working-directory: app/src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [macos, linux-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release -type f | sort)
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "inksprite $TAG" \
            --notes-file - <<'EOF'
          A development build of the desktop app.

          - **macOS**: the `.dmg`, for Apple silicon and Intel Macs. Signed and notarized.
          - **Windows**: the `-setup.exe`. It isn't signed, so Windows warns that it doesn't recognize the app: choose More info, then Run anyway.
          - **Linux**: the `.AppImage`, or the `.deb` for Debian and Ubuntu. If the window opens blank, start the app with `WEBKIT_DISABLE_DMABUF_RENDERER=1` set.

          The Windows and Linux builds haven't been tried on a real machine yet.
          EOF
