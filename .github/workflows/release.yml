name: Desktop Release

# The desktop app for macOS, Windows and Linux, published as the latest
# release. The Mac builds, one for Apple silicon and one for Intel Macs, are
# signed and notarized; the Windows and Linux builds are not code-signed. Run
# by pushing a tag (v0.1.0-dev.1), or by hand with one, which is then made at
# the commit being built. The app is built as the tag's version.
#
# The page is built once, and each system's job wraps that same build with
# electron-builder (app/electron/electron-builder.yml). The release is made
# only when every system has built, so it never goes out with one missing.
# Its notes are CHANGELOG.md's section for the tag, then which file to
# download; a tag the changelog has no section for is refused.
#
# The app updates itself from the latest release (app/electron/src/
# updates.js): each system's build comes with a latest*.yml that names its
# update and the update's hash. GitHub's latest release is never a
# pre-release, so these are not marked as pre-releases.
#
# Never on a pull request: this workflow holds the signing secrets. They live
# in the `release` environment. It runs only on a public repository, because
# a release there is the only kind that can be downloaded without signing in
# to GitHub.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, such as v0.1.0-dev.1'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  page:
    name: Page
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    environment: release
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      # The version is the tag without its v: v0.1.0-dev.4 is 0.1.0-dev.4.
      # The updater compares versions as semver, so 0.1.0-dev.10 comes after
      # 0.1.0-dev.9, and 0.1.0 after both.
      - name: Check the tag
        id: tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "A release tag is v and a version, such as v0.1.0 or v0.1.0-dev.4: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # The release's notes start with CHANGELOG.md's section for the tag,
      # taken here so that a tag without one stops before anything builds.
      - name: Take the release notes from the changelog
        run: |
          awk -v tag="$TAG" '/^## / { if (found) exit; found = ($2 == tag); next } found' \
            CHANGELOG.md | sed '/./,$!d' > notes.md
          if ! grep -q . notes.md; then
            echo "CHANGELOG.md has no section headed $TAG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # engines.node: pdfjs-dist 6 needs Node 22.13 or later.
          node-version-file: app/package.json
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # VITE_VERCEL_ANALYTICS is left unset, so the desktop build has none.
      # The desktop Google client is the release environment's; unset, the
      # build has no import from Google Drive. The version is the one About
      # shows.
      - name: Build the page
        working-directory: app
        env:
          VITE_APP_VERSION: ${{ steps.tag.outputs.version }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: app/dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: ${{ matrix.name }}
    needs: page
    runs-on: ${{ matrix.runner }}
    environment: release
    env:
      VERSION: ${{ needs.page.outputs.version }}
    defaults:
      run:
        shell: bash
    # Each system builds to the end even when another fails, so a run says
    # what is wrong with every one of them. The release still waits on all.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            system: --mac
          - name: Windows
            runner: windows-latest
            system: --win
          - name: Linux
            runner: ubuntu-latest
            system: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: page
          path: app/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/electron/package.json
          cache: 'npm'
          cache-dependency-path: app/electron/package-lock.json

      - name: Install dependencies
        working-directory: app/electron
        run: npm ci

      - name: Set the version
        working-directory: app/electron
        run: npm pkg set version="$VERSION"

      # On a Mac, electron-builder imports the certificate into a keychain of
      # its own, signs the app, sends it to Apple to be notarized, and staples
      # the ticket to it. The key file is written where the runner throws its
      # files away. Elsewhere the Apple secrets are left out.
      - name: Build
        working-directory: app/electron
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_P8 || '' }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          fi
          npx electron-builder ${{ matrix.system }} --publish never

      # The check a Mac makes on an app downloaded from the internet: signed
      # with a Developer ID, and notarized, with the ticket stapled on.
      - name: Check Gatekeeper accepts the app
        if: runner.os == 'macOS'
        working-directory: app/electron/dist
        run: |
          for app in mac-arm64/inksprite.app mac/inksprite.app; do
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      # The installers, and the updates with what the updater reads about
      # them.
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            app/electron/dist/*.dmg
            app/electron/dist/*.zip
            app/electron/dist/*.exe
            app/electron/dist/*.AppImage
            app/electron/dist/*.deb
            app/electron/dist/*.blockmap
            app/electron/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [page, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: notes

      # The changelog's section, then which file to download.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >> notes.md <<'EOF'

          ## Downloads

          A development build of the desktop app.

          - **macOS**: the `.dmg` ending in `arm64` for Apple silicon, or in `x64` for an Intel Mac. Signed and notarized.
          - **Windows**: the `.exe`. It isn't signed, so Windows warns that it doesn't recognize the app: choose More info, then Run anyway.
          - **Linux**: the `.AppImage`, or the `.deb` for Debian and Ubuntu. If the AppImage won't start on Ubuntu 24.04 or later, install the `.deb`, or start the AppImage with `--no-sandbox`.

          Once installed, the app updates itself: it downloads each new release and offers to restart into it. The `.zip`, `.blockmap` and `.yml` files are for the updater.

          An app installed from a release before v0.1.0-dev.8, the first built with Electron, doesn't update to this one; install it over that one.
          EOF
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "inksprite $TAG" \
            --notes-file notes.md
