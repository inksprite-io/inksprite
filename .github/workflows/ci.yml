name: CI

on:
  push:
    branches: [main]  # Only run on main branch pushes
  pull_request:
    branches: [main, dev]  # Run on PRs to main and dev
    types: [opened, synchronize, reopened, ready_for_review]  # Skip draft PRs
  workflow_dispatch:  # Allow manual trigger

jobs:
  signoff:
    name: Sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit a pull request adds must carry a Signed-off-by trailer;
      # CONTRIBUTING.md says what it means. Merges are skipped, since the
      # trailer belongs on the commits they bring in.
      - name: Check every commit for a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for sha in $(git rev-list --no-merges "$(git merge-base "$BASE" "$HEAD")..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -q -E '^Signed-off-by: .+ <.+@.+>$'; then
              missing="$missing$(git log -1 --format='%h %s' "$sha")"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "These commits have no Signed-off-by trailer (see CONTRIBUTING.md; git commit -s adds one):"
            printf '%s' "$missing"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run linter
        working-directory: app
        run: npm run lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Check formatting
        working-directory: app
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run type checking
        working-directory: app
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests with coverage
        working-directory: app
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, test]
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: app/dist/
          retention-days: 7

